[package]
name = "rdp_manager"
version = "0.2.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
arboard = "3.7.0"
base64 = "0.23.1"
des = "0.9"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence", "clipboard"] }
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
flate2 = "1"
getrandom = "0.4.3"
pbkdf2 = "0.13.0"
portable-pty = "0.9.0"
raw-window-handle = "0.6.2"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
uuid = { version = "1.29.2", features = ["v4"] }
vt100 = "0.18.1"
webview2-com = "0.39"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_Xps", "Win32_NetworkManagement_IpHelper","Win32_System_Time","Win32_Security_Cryptography","Win32_System_Registry", "Win32_System_WinRT", "Security_Credentials_UI", "Foundation"] }

[profile.release]
strip = true
lto = "thin"

